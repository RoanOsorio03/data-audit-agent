name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Verify all modules import
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          import setup_data
          import sentinel
          import app
          print('setup_data, sentinel, app all import cleanly')
          "

      - name: Deterministic tests (no network, no secrets)
        run: pytest tests/test_deterministic.py -v
